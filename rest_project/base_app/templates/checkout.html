{% extends "base.html" %}
<!-- {% block class %}class="sub_page"{% endblock class %} -->

{% block main %}
<div class="checkout-container">
  <div class="checkout-card">

    <h3 class="checkout-title">Select Payment Method</h3>

    <form method="POST" action="{% url 'place_order' %}">
      {% csrf_token %}

      <label class="pay-option">
        <input type="radio" name="payment_method" value="cod" checked>
        Cash on Delivery
      </label>

      <label class="pay-option">
        <input type="radio" name="payment_method" value="online" id="onlineRadio">
        Online Payment
      </label>

      <!-- Online options -->
      <div id="online-options" style="display:none; margin-top:15px;">

        <label class="pay-sub">
          <input type="radio" name="online_type" value="upi"> UPI
        </label>

        <label class="pay-sub">
          <input type="radio" name="online_type" value="card"> Debit / Credit Card
        </label>

        <label class="pay-sub">
          <input type="radio" name="online_type" value="netbanking"> Net Banking
        </label>

      </div>

      <button type="submit" class="btn btn-success place-order-btn">
        Place Order
      </button>

    </form>

  </div>
</div>

<script>
  const onlineRadio = document.getElementById("onlineRadio");
  const onlineOptions = document.getElementById("online-options");
  const radios = document.querySelectorAll("input[name='payment_method']");

  radios.forEach(radio => {
    radio.addEventListener("change", () => {
      onlineOptions.style.display = onlineRadio.checked ? "block" : "none";
    });
  });
</script>
{% endblock %}
